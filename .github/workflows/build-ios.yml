name: ios-build

# Builds an unsigned app package. First run takes 1.5-3 h;
# later runs are much faster thanks to the bazel disk cache.
# Manual dispatch only.
#
# Run from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        default: release_arm64
        options:
          - release_arm64
          - release_sim_arm64
      target:
        description: 'Optional bazel target for a fast compile-only check (no IPA, e.g. //submodules/Display:Display). Leave empty for the full app build.'
        type: string
        default: ''
      keepGoing:
        description: 'Collect all compile errors in one run (--keep_going)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Unsigned IPA (${{ inputs.configuration || 'release_arm64' }})
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read pinned toolchain versions (versions.json)
        id: versions
        run: |
          echo "xcode=$(node -e "console.log(require('./versions.json').xcode)")" >> "$GITHUB_OUTPUT"
          echo "bazel=$(node -e "console.log(require('./versions.json').bazel.split(':')[0])")" >> "$GITHUB_OUTPUT"

      - name: Verify no unwanted identifiers in sources
        run: |
          HITS=$(grep -r -l -E "CustomTelemetry|custom\.telemetry|telemetryToggle|workers\.dev|anonymousAnalytics" \
            --include="*.swift" --include="*.m" --include="*.h" --include="*.c" --include="*.cpp" \
            submodules Telegram 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Unwanted identifiers found in sources:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: sources contain no unwanted identifiers."

      - name: Select Xcode ${{ steps.versions.outputs.xcode }}
        run: |
          ls /Applications | grep -i xcode || true
          XCODE_PATH="$(ls -d /Applications/Xcode*${{ steps.versions.outputs.xcode }}* 2>/dev/null | sort | tail -1)"
          if [ -n "$XCODE_PATH" ]; then
            echo "Found pinned Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "::warning::Pinned Xcode ${{ steps.versions.outputs.xcode }} not on this image;"
            echo "::warning::falling back to the default Xcode with --overrideXcodeVersion."
            echo "::warning::If compilation fails due to SDK mismatch, pin Xcode 26.2 via maxim-lobanov/setup-xcode@v1."
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install pinned bazel ${{ steps.versions.outputs.bazel }}
        run: |
          case "$(uname -m)" in
            arm64|aarch64) BARCH=arm64 ;;
            *) BARCH=x86_64 ;;
          esac
          URL="https://github.com/bazelbuild/bazel/releases/download/${{ steps.versions.outputs.bazel }}/bazel-${{ steps.versions.outputs.bazel }}-darwin-${BARCH}"
          # Release assets are served through a CDN that occasionally answers
          # 502/504. Retry the download instead of failing the whole build on a
          # transient error, which is what a plain curl does.
          DOWNLOADED=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              -o /usr/local/bin/bazel "$URL"; then
              DOWNLOADED=1
              break
            fi
            echo "bazel download attempt ${attempt} failed"
            sleep 15
          done
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "bazel download failed after 5 attempts: $URL"
            exit 1
          fi
          chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf "/Applications/Xcode_15.4.app" "/Applications/Xcode_16.app" 2>/dev/null || true
          brew uninstall --cask --force google-chrome microsoft-edge 2>/dev/null || true
          rm -rf ~/Library/Caches/* 2>/dev/null || true
          df -h /

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: bazel-cache
          key: bazel-cache-macos-${{ steps.versions.outputs.bazel }}-${{ github.run_id }}
          restore-keys: bazel-cache-macos-${{ steps.versions.outputs.bazel }}-

      - name: Prepare build configuration from secrets
        env:
          CUSTOM_API_ID: ${{ secrets.CUSTOM_API_ID }}
          CUSTOM_API_HASH: ${{ secrets.CUSTOM_API_HASH }}
          CUSTOM_ARCHIVE_URL: ${{ secrets.CUSTOM_ARCHIVE_URL }}
          CUSTOM_ARCHIVE_TOKEN: ${{ secrets.CUSTOM_ARCHIVE_TOKEN }}
        run: |
          if [ -z "$CUSTOM_API_ID" ] || [ -z "$CUSTOM_API_HASH" ]; then
            echo "::error::Missing secrets CUSTOM_API_ID / CUSTOM_API_HASH."
            echo "Add them in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p build-input
          python3 - <<'PYEOF'
          import json, os
          cfg = {
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["CUSTOM_API_ID"],
              "api_hash": os.environ["CUSTOM_API_HASH"],
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "archive_url": os.environ.get("CUSTOM_ARCHIVE_URL", ""),
              "archive_token": os.environ.get("CUSTOM_ARCHIVE_TOKEN", "")
          }
          with open('build-input/ci-configuration.json', 'w') as f:
              json.dump(cfg, f, indent='\t')
          print('Configuration written: api_id =', cfg["api_id"][:3] + '***')
          PYEOF

      - name: Stage example profiles for re-stamping
        run: |
          mkdir -p build-input/codesigning-src/profiles build-input/codesigning-src/certs
          cp build-system/example-configuration/provisioning/*.mobileprovision build-input/codesigning-src/profiles/
          cp build-system/fake-codesigning/certs/* build-input/codesigning-src/certs/
          ls build-input/codesigning-src/profiles build-input/codesigning-src/certs

      - name: Re-stamp profiles with the self-signed certificate
        run: |
          # The p12 is legacy-encrypted (RC2); macOS system LibreSSL cannot parse it.
          # Point the script at Homebrew OpenSSL 3 via OPENSSL_BIN.
          export HOMEBREW_NO_AUTO_UPDATE=1
          OPENSSL_BIN=""
          for CAND in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl; do
            if [ -x "$CAND" ]; then OPENSSL_BIN="$CAND"; break; fi
          done
          if [ -z "$OPENSSL_BIN" ]; then
            brew install openssl@3
            OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          fi
          echo "Using OPENSSL_BIN=$OPENSSL_BIN ($("$OPENSSL_BIN" version))"
          case "$($OPENSSL_BIN version)" in
            OpenSSL*) : ;;
            *) echo "::error::Homebrew OpenSSL 3 required; system LibreSSL cannot parse the legacy RC2 p12"; exit 1 ;;
          esac
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            generate-verification-profiles \
            --configurationPath build-input/ci-configuration.json \
            --codesigningInformationPath build-input/codesigning-src \
            --destination build-input/fake-codesigning/profiles
          ls build-input/fake-codesigning/profiles

      - name: Import self-signed certificate into a build keychain
        run: |
          security create-keychain -p buildpwd build.keychain
          security list-keychains -d user -s build.keychain "$(security list-keychains -d user | tr -d '"' | xargs)"
          security set-keychain-settings -t 3600 build.keychain
          security unlock-keychain -p buildpwd build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security
          security import build-system/fake-codesigning/certs/Public.cer \
            -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security || true
          security import build-system/AppleWWDRCAG3.cer \
            -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security || true
          # macOS marks a self-signed identity invalid unless its root cert is
          # trusted. Trust it in the admin (System) keychain: the user-keychain
          # variant pops a GUI confirmation on headless runners and hangs forever.
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            build-system/fake-codesigning/certs/Public.cer
          security set-key-partition-list -S apple-tool:,apple: -k buildpwd build.keychain
          security find-identity -v build.keychain

      - name: Build (self-signed, unsigned-for-device)
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.keepGoing }}" != "false" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --continueOnError"
          fi
          ARTIFACT_ARGS="--outputBuildArtifactsPath build/artifacts"
          if [ -n "${{ inputs.target }}" ]; then
            # Fast mode: compile a single bazel target only (no IPA, no artifact collection).
            # A bare library target has no apple configuration transition, so it would build
            # for the host; pin the target platform explicitly.
            EXTRA_ARGS="$EXTRA_ARGS --target ${{ inputs.target }}"
            # A bare library target has no apple configuration transition, so it would build
            # for the host; pin the target platform explicitly. The fast check exists to
            # surface real compile errors (the full IPS build still validates warnings),
            # so warnings treated as errors by -warnings-as-errors copts are demoted:
            # Xcode 26 marks large parts of these old sources deprecated, which would
            # otherwise bury actual errors under hundreds of -Wdeprecated-declarations.
            EXTRA_ARGS="$EXTRA_ARGS --extraBazelArg=--swiftcopt=-suppress-warnings"
            EXTRA_ARGS="$EXTRA_ARGS --extraBazelArg=--copt=-Wno-error=deprecated-declarations"
            if [ "${{ inputs.configuration }}" = "release_sim_arm64" ]; then
              EXTRA_ARGS="$EXTRA_ARGS --extraBazelArg=--platforms=//build-system/bazel-utils/platforms:ios_sim_arm64"
            else
              EXTRA_ARGS="$EXTRA_ARGS --extraBazelArg=--platforms=//build-system/bazel-utils/platforms:ios_arm64_device"
            fi
            ARTIFACT_ARGS=""
          fi
          mkdir -p build/artifacts
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$(pwd)/bazel-cache" \
            build \
            --configurationPath build-input/ci-configuration.json \
            --codesigningInformationPath build-input/fake-codesigning \
            --buildNumber 145 \
            --configuration "${{ inputs.configuration || 'release_arm64' }}" \
            $EXTRA_ARGS \
            $ARTIFACT_ARGS

      - name: Rename IPA and hash it
        if: inputs.target == ''
        run: |
          mv build/artifacts/Telegram.ipa build/artifacts/app-unsigned.ipa
          shasum -a 256 build/artifacts/app-unsigned.ipa | tee build/artifacts/SHA256SUMS.txt
          ls -la build/artifacts

      - name: Save bazel cache for future runs
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: bazel-cache
          key: bazel-cache-macos-${{ steps.versions.outputs.bazel }}-${{ github.run_id }}

      - name: Upload unsigned IPA
        if: inputs.target == ''
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: |
            build/artifacts/app-unsigned.ipa
            build/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
