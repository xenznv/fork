name: CI

on:
  push:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The sources build against the iOS 27 SDK (UIView.reservedRegions and the iPhone Duo layout), so the
    # runner image must carry Xcode 27; macos-latest ships Xcode 26 and fails in submodules/Display.
    runs-on: xcode-27
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      # The build expects the Xcode named in versions.json. When the runner image does not
      # carry it, the newest installed Xcode is used and the version check is bypassed below.
      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          WANTED="$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')"
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$WANTED.app/Contents/Developer"
            echo "overrideXcodeVersion=" >> "$GITHUB_OUTPUT"
          else
            NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
            echo "Xcode $WANTED is not installed, using $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
            echo "overrideXcodeVersion=--overrideXcodeVersion" >> "$GITHUB_OUTPUT"
          fi
          xcodebuild -version

      # api_id/api_hash come from build-system/appstore-configuration.json (the credentials
      # Telegram publishes with the sources) unless TELEGRAM_API_ID/TELEGRAM_API_HASH secrets
      # are set for this repository.
      - name: Prepare API credentials
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          if [ -n "${API_ID:-}" ] && [ -n "${API_HASH:-}" ]; then
            python3 -c "import json,os; p='build-system/appstore-configuration.json'; d=json.load(open(p)); d['api_id']=os.environ['API_ID']; d['api_hash']=os.environ['API_HASH']; open(p,'w').write(json.dumps(d, indent='\t'))"
            echo "Using api credentials from repository secrets"
          else
            echo "Using the api credentials bundled with build-system/appstore-configuration.json"
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          # A signing identity generated on this runner: the bundled fake certificate does not import into
          # the runner keychain, and the bundled profiles have expired.
          SIGNING="ci-signing"
          rm -rf "$SIGNING"
          mkdir -p "$SIGNING/certs" "$SIGNING/profiles"
          # /usr/bin/openssl is LibreSSL: it seals the p12 with the legacy algorithms `security import` reads.
          # Homebrew's OpenSSL 3 exports AES/SHA256, which `security` rejects ("MAC verification failed").
          /usr/bin/openssl req -x509 -newkey rsa:2048 -keyout "$SIGNING/key.pem" -out "$SIGNING/certs/cert.pem" \
            -days 400 -nodes \
            -subj "/CN=Apple Distribution: Telegram FZ-LLC (C67CF9S4VU)/OU=SELFSIGNED/C=US"
          /usr/bin/openssl pkcs12 -export -out "$SIGNING/certs/SelfSigned.p12" \
            -inkey "$SIGNING/key.pem" -in "$SIGNING/certs/cert.pem" -passout pass:secret
          cp build-system/fake-codesigning/profiles/*.mobileprovision "$SIGNING/profiles/"

          # An explicit keychain: `security import` of an empty-password p12 leaves it empty on recent macOS.
          export TELEGRAM_SIGNING_P12_PASSWORD=secret
          security create-keychain -p secret ci.keychain || true
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p secret ci.keychain
          security import "$SIGNING/certs/SelfSigned.p12" -k ci.keychain -P secret \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k secret ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          python3 -u build-system/Make/Make.py \
            generate-verification-profiles \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="$SIGNING" \
            --destination="$SIGNING/generated" \
            --certsPath="$SIGNING/certs"
          cp "$SIGNING"/generated/*.mobileprovision "$SIGNING/profiles/"

          echo '--- codesigning identities ---'
          security find-identity -p codesigning | head -5 || true

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            ${{ steps.xcode.outputs.overrideXcodeVersion }} \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="$SIGNING" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-DSYMs-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14
